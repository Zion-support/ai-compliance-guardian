<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Compliance Guardian</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:120px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🦉 AI Compliance Guardian</h1><p>Estimate the effort automation saves your compliance team.</p><label>Controls monitored: <input id="c" type="number" value="120"></label> <label>Hours/control/mo (manual): <input id="h" type="number" value="2"></label> <label>Loaded hourly cost ($): <input id="r" type="number" value="85"></label> <button onclick="go()">Calculate</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const hrs=g('c')*g('h'),save=Math.round(hrs*0.8);document.getElementById('out').textContent=`Manual effort: ${hrs}h/mo = $${(hrs*g('r')).toLocaleString()}/mo\nWith automation (80% reduction): save ${save}h = $${(save*g('r')).toLocaleString()}/mo\nAnnual: $${(save*g('r')*12).toLocaleString()}\n+ Audit prep time cut from weeks to days\n\nDeploy Compliance Guardian: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-compliance-guardian">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-compliance-monitor/">Compliance Monitor</a></p></body></html>
